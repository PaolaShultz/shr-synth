name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cargo_args: ['--all-features', '--no-default-features']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev g++
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustc +1.97.1 -vV
      - name: Formatting
        run: |
          cargo +1.97.1 fmt --all -- --check
      - name: Locked check
        run: |
          cargo +1.97.1 check --locked --all-targets ${{ matrix.cargo_args }}
      - name: Normal offline tests
        run: |
          cargo +1.97.1 test --locked --all-targets ${{ matrix.cargo_args }} -- --test-threads=1

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline fitter contracts
        run: |
          mkdir -p artifacts
          python3 -m venv "$RUNNER_TEMP/audio-fit-env"
          "$RUNNER_TEMP/audio-fit-env/bin/python" -m pip install -r tools/audio_fit/requirements.txt
          "$RUNNER_TEMP/audio-fit-env/bin/python" -m unittest discover -s tools/audio_fit -p 'test_*.py'
