[package]
name = "shr-synth"
version = "0.2.4"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Headless real-time synthesizer core for SHR-DAW"
repository = "https://github.com/PaolaShultz/shr-synth"
license = "MIT"

[lib]
name = "shr_synth"

[[bin]]
name = "shr-synth"
path = "src/main.rs"

[[bin]]
name = "open303-lab"
path = "src/bin/open303-lab.rs"
required-features = ["open303"]

[features]
default = ["open303"]
open303 = ["dep:cc"]

[build-dependencies]
cc = { version = "1.4", optional = true }

[dependencies]
alsa = "0.7.1"
anyhow = "1"
hound = "3.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_no_alloc = "1.1"
tempfile = "3"
